<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Luma — sem conexão</title>
<style>
  /* Tela local de erro da casca desktop — cores do brandbook (00-tokens.css). */
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Roboto,sans-serif;background:#FAFAFA;color:#0A0A0A;
    height:100vh;display:flex;align-items:center;justify-content:center}
  .card{text-align:center;max-width:420px;padding:40px}
  .dot{width:64px;height:64px;border-radius:50%;margin:0 auto 22px;
    background:linear-gradient(158deg,#FF9000,#F85400 62%,#C81818 130%);
    display:flex;align-items:center;justify-content:center}
  .dot svg{width:30px;height:30px;color:#fff}
  h1{font-size:20px;font-weight:900;margin-bottom:8px}
  p{font-size:14px;color:#6B6B6B;line-height:1.6;margin-bottom:24px}
  button{font-size:14px;font-weight:700;color:#fff;background:#FF9000;border:none;
    border-radius:999px;padding:12px 28px;cursor:pointer;transition:filter .14s}
  button:hover{filter:brightness(1.05)}
</style>
</head>
<body>
  <div class="card">
    <div class="dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M1.42 9a16 16 0 0121.16 0M5 12.55a11 11 0 0114.08 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        <line x1="2" y1="2" x2="22" y2="22"/>
      </svg>
    </div>
    <h1>Sem conexão com a internet</h1>
    <p>O Luma precisa de internet para carregar o catálogo e gerar as artes. Verifique a conexão e tente de novo.</p>
    <button onclick="window.location='https://ryanmotta-ai.github.io/Luma/'">Tentar de novo</button>
  </div>
</body>
</html>
