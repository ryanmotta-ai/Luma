<svg xmlns="http://www.w3.org/2000/svg" data-luma="1" viewBox="0 0 1080 1350" width="1080" height="1350"><defs><style>
@font-face{font-family:'Realce';src:url('asset:fontes/realce-black.woff2') format('woff2');font-weight:900;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Light.woff2') format('woff2');font-weight:300;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-LightItalic.woff2') format('woff2');font-weight:300;font-style:italic;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Black.woff2') format('woff2');font-weight:900;}
.hero{font-family:'Realce',sans-serif;font-weight:900;letter-spacing:0.5px}
.sup{font-family:'Roboto',sans-serif;font-weight:400;letter-spacing:1.2px}
.body{font-family:'Roboto',sans-serif;font-weight:400}
.legal{font-family:'Roboto',sans-serif;font-weight:300;letter-spacing:0.3px}
.leve{font-family:'Roboto',sans-serif;font-weight:300;font-style:italic}
.forte{font-family:'Roboto',sans-serif;font-weight:900}
</style>
<filter id="shs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#434343" flood-opacity="0.2"/></filter>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#434343" flood-opacity="0.25"/></filter>
</defs>
<rect width="1080" height="1350" fill="#F85400"/>
<image href="asset:logos/dm-h-branca.png" x="100" y="80" width="260" height="52"/>
<rect x="100" y="170" width="330" height="70" rx="35" fill="#FFFFFF"/>
<text x="265" y="219" text-anchor="middle" class="hero" font-size="40" fill="#F85400">BORA COMEMORAR!</text>
<!-- {{anos}}: o número cresce para a esquerda→direita a partir de x=100; com 2 dígitos ("10") o lockup vai até x≈845 -->
<g id="produto">
  <text x="100" y="604" class="hero" font-size="450" fill="#FFFFFF" data-campo="anos">3</text>
  <text x="318" y="382" class="forte" font-size="144" fill="#FFFFFF">ANOS</text>
  <text x="318" y="493" class="forte" font-size="86" fill="#FFFFFF">NA SUA</text>
  <text x="318" y="604" class="forte" font-size="86" fill="#FFFFFF">CIDADE</text>
</g>
<text x="100" y="708" font-size="66" fill="#FFFFFF"><tspan class="leve">o aniversário é </tspan><tspan class="forte">nosso,</tspan></text>
<text x="100" y="788" font-size="66" fill="#FFFFFF"><tspan class="leve">o presente é </tspan><tspan class="forte">seu!</tspan></text>
<!-- ticket = assets/cards-preco/ticket-cupom.svg (680×250) em escala 1.2941 (880×324) -->
<clipPath id="tkf"><path d="M 30 0 L 650 0 C 665 0 680 15 680 30 C 655 55 655 85 680 110 C 655 135 655 165 680 190 C 655 215 655 240 680 250 L 30 250 C 15 250 0 235 0 220 C 25 195 25 165 0 140 C 25 115 25 85 0 60 C 25 35 25 15 0 0 Z"/></clipPath>
<g transform="translate(100,866) scale(1.2941)" filter="url(#sh)">
  <g clip-path="url(#tkf)">
    <rect width="680" height="250" fill="#FFFFFF"/>
    <rect width="144" height="250" fill="#F62900"/>
    <path d="M 30 0 L 650 0 C 665 0 680 15 680 30 C 655 55 655 85 680 110 C 655 135 655 165 680 190 C 655 215 655 240 680 250 L 30 250 C 15 250 0 235 0 220 C 25 195 25 165 0 140 C 25 115 25 85 0 60 C 25 35 25 15 0 0 Z" fill="none" stroke="#FF9000" stroke-width="28"/>
  </g>
</g>
<text transform="translate(226,1028) rotate(-90)" text-anchor="middle" class="hero" font-size="66" fill="#FFFFFF">CUPOM</text>
<!-- {{desconto_valor}} · {{codigo_cupom}} -->
<g id="detalhes">
  <text x="322" y="948" class="sup" font-size="34" fill="#434343">SEU PRESENTE</text>
  <text x="322" y="1046" class="hero" font-size="104" fill="#F85400" data-campo="desconto_valor">R$ 15 OFF</text>
  <line x1="322" y1="1072" x2="890" y2="1072" stroke="#FFB900" stroke-width="3" stroke-linecap="round"/>
  <text x="322" y="1132" class="sup" font-size="30" fill="#434343">CÓDIGO</text>
  <text x="446" y="1132" class="forte" font-size="50" fill="#434343" data-campo="codigo_cupom">NIVERDM15</text>
</g>
<text x="100" y="1270" class="legal" font-size="26" fill="#FFFFFF">Válido para pedidos acima de R$ 40. Consulte as regras no app.</text>
</svg>
