<svg xmlns="http://www.w3.org/2000/svg" data-luma="1" viewBox="0 0 1080 1350" width="1080" height="1350"><defs><style>
@font-face{font-family:'Realce';src:url('asset:fontes/realce-black.woff2') format('woff2');font-weight:900;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Light.woff2') format('woff2');font-weight:300;}
.hero{font-family:'Realce',sans-serif;font-weight:900;letter-spacing:0.5px}
.sup{font-family:'Roboto',sans-serif;font-weight:400;letter-spacing:1.2px}
.body{font-family:'Roboto',sans-serif;font-weight:400}
.legal{font-family:'Roboto',sans-serif;font-weight:300;letter-spacing:0.3px}
</style>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#434343" flood-opacity="0.25"/></filter>
<filter id="shs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#434343" flood-opacity="0.2"/></filter>
</defs>
<rect width="1080" height="1350" fill="#F85400"/>
<image href="asset:logos/dm-h-branca.png" x="100" y="80" width="260" height="52"/>
<g id="produto">
  <text x="100" y="300" class="hero" font-size="151" data-campo="produto" fill="#FFFFFF">PIZZA CALABRESA</text>
</g>
<text x="100" y="368" class="body" font-size="40" fill="#FFFFFF">Tradicional, direto pelo app</text>
<g id="foto_produto"><rect x="100" y="430" width="880" height="520" rx="56" fill="#D9D9D9"/>
<g transform="translate(540,660)">
  <rect x="-65" y="-68" width="130" height="98" rx="18" fill="none" stroke="#434343" stroke-width="7.5"/>
  <circle cx="26" cy="-38" r="8" fill="#434343"/>
  <polyline points="-42,12 -8,-24 24,12" fill="none" stroke="#434343" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="6,12 32,-14 48,12" fill="none" stroke="#434343" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="85" text-anchor="middle" class="body" font-size="32" fill="#434343">Use aqui sua foto do produto</text>
</g></g>
<g transform="translate(880,452)" filter="url(#shs)">
  <circle r="100" fill="#FFB900"/>
  <text y="8" text-anchor="middle" class="hero" font-size="72" fill="#434343">18%</text>
  <text y="52" text-anchor="middle" class="hero" font-size="40" fill="#434343">OFF</text>
</g>
<g data-sobrepoe="foto">
  <rect x="100" y="870" width="470" height="310" rx="36" fill="#FFFFFF" filter="url(#sh)"/>
  <g id="preco">
    <text x="148" y="934" class="body" font-size="40" fill="#434343" text-decoration="line-through" data-campo="precoDe">DE R$ 28,00</text>
    <text x="150" y="992" class="sup" font-size="38" fill="#434343">POR</text>
    <text x="146" y="1134" class="hero" font-size="168" data-campo="precoPor" fill="#F85400"><tspan font-size="92" dy="-59">R$</tspan><tspan dy="59" dx="6">22</tspan><tspan font-size="92" dy="-59">,90</tspan></text>
  </g>
</g>
<rect x="692" y="1084" width="288" height="96" rx="48" fill="none" stroke="#FFFFFF" stroke-width="4"/>
<text x="836" y="1152" text-anchor="middle" class="hero" font-size="56" fill="#FFFFFF">PEDIR</text>
<text x="100" y="1250" class="legal" font-size="26" fill="#FFFFFF">Imagem ilustrativa. Oferta válida enquanto durarem os estoques.</text>
</svg>
