<svg xmlns="http://www.w3.org/2000/svg" data-luma="1" viewBox="0 0 1080 1920" width="1080" height="1920"><defs><style>
@font-face{font-family:'Realce';src:url('asset:fontes/realce-black.woff2') format('woff2');font-weight:900;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Light.woff2') format('woff2');font-weight:300;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-LightItalic.woff2') format('woff2');font-weight:300;font-style:italic;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Black.woff2') format('woff2');font-weight:900;}
.hero{font-family:'Realce',sans-serif;font-weight:900;letter-spacing:0.5px}
.body{font-family:'Roboto',sans-serif;font-weight:400}
.legal{font-family:'Roboto',sans-serif;font-weight:300;letter-spacing:0.3px}
.leve{font-family:'Roboto',sans-serif;font-weight:300;font-style:italic}
.forte{font-family:'Roboto',sans-serif;font-weight:900}
</style>
<radialGradient id="brilho" cx="330" cy="960" r="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<filter id="shs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#434343" flood-opacity="0.2"/></filter>
</defs>
<!-- much+ (skill §3.5). Composição assimétrica: eixo à esquerda (x=100), a faixa útil inteira
     (290…1660) com vãos largos, e o peso puxado para os cantos — o "+" sangra no alto à direita,
     o ticket sangra embaixo à direita. Nada empilhado no meio. -->
<rect width="1080" height="1920" fill="#E52676"/>
<rect width="1080" height="1920" fill="url(#brilho)"/>
<!-- grafismo: + amarelo sangrando no canto de cima (a zona do Instagram só leva grafismo) -->
<g transform="rotate(12 960 300)"><image href="asset:elementos/mais-amarelo-brilhos.png" x="790" y="150" width="340" height="337"/></g>
<!-- assinatura -->
<image href="asset:logos/much-plus-branco.png" x="100" y="290" width="176" height="50"/>
<line x1="306" y1="291" x2="306" y2="339" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
<image href="asset:logos/dm-h-branca.png" x="336" y="294" width="240" height="48"/>
<!-- receita A: frase mista -->
<text x="100" y="476" font-size="66" fill="#FFFFFF"><tspan class="leve">todo mês tem </tspan><tspan class="forte">cupom</tspan></text>
<text x="102" y="558" font-size="66" fill="#FFFFFF"><tspan class="leve">pra você </tspan><tspan class="forte">economizar!</tspan></text>
<!-- receita C aberta em degraus: ATÉ R$ em cima, o 10 gigante, a coluna OFF presa à linha de base -->
<g id="produto">
  <text x="104" y="716" class="hero" font-size="88" fill="#FFFFFF">ATÉ R$</text>
  <text x="100" y="1106" class="hero" font-size="470" data-campo="desconto_valor" fill="#FFFFFF">10</text>
  <text x="520" y="958" class="forte" font-size="160" fill="#FFFFFF">OFF</text>
  <text x="526" y="1042" class="forte" font-size="54" fill="#FFFFFF">EM CADA</text>
  <text x="526" y="1106" class="forte" font-size="54" fill="#FFFFFF">CUPOM</text>
</g>
<image href="asset:elementos/estrela-amarela.png" x="880" y="770" width="76" height="88"/>
<!-- apoio à esquerda, ticket à direita sangrando a borda -->
<g id="detalhes">
  <text x="100" y="1262" class="hero" font-size="72" fill="#FFB900" data-campo="detalhes">5 CUPONS</text>
  <text x="100" y="1320" class="body" font-size="36" fill="#FFFFFF">todo mês, pra usar como quiser</text>
</g>
<g transform="rotate(-14 900 1370)" filter="url(#shs)"><image href="asset:cupons/cupom-much-plus.png" x="730" y="1240" width="360" height="324"/></g>
<!-- ação -->
<rect x="100" y="1418" width="540" height="104" rx="52" fill="#FFB900" filter="url(#shs)"/>
<text x="370" y="1489" text-anchor="middle" class="forte" font-size="52" fill="#E52676">conhecer o much+</text>
<text x="100" y="1624" class="legal" font-size="26" fill="#FFFFFF">Exclusivo para assinantes much+. Consulte as regras no app.</text>
</svg>
