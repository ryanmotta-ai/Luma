<svg xmlns="http://www.w3.org/2000/svg" data-luma="1" viewBox="0 0 1080 1920" width="1080" height="1920"><defs><style>
@font-face{font-family:'Realce';src:url('asset:fontes/realce-black.woff2') format('woff2');font-weight:900;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Regular.woff2') format('woff2');font-weight:400;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Light.woff2') format('woff2');font-weight:300;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-LightItalic.woff2') format('woff2');font-weight:300;font-style:italic;}
@font-face{font-family:'Roboto';src:url('asset:fontes/Roboto-Black.woff2') format('woff2');font-weight:900;}
.hero{font-family:'Realce',sans-serif;font-weight:900;letter-spacing:0.5px}
.body{font-family:'Roboto',sans-serif;font-weight:400}
.legal{font-family:'Roboto',sans-serif;font-weight:300;letter-spacing:0.3px}
.leve{font-family:'Roboto',sans-serif;font-weight:300;font-style:italic}
.forte{font-family:'Roboto',sans-serif;font-weight:900}
</style>
<filter id="shs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#434343" flood-opacity="0.2"/></filter>
<radialGradient id="brilho" cx="540" cy="980" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#434343" flood-opacity="0.25"/></filter>
</defs>
<!-- Sub-marca much+ (skill §3.5): rosa #E52676 + amarelo #FFB900, o "+" como grafismo -->
<rect width="1080" height="1920" fill="#E52676"/>
<!-- profundidade das refs much+: brilho branco (só opacidade, sem cor nova) atrás do valor -->
<rect width="1080" height="1920" fill="url(#brilho)"/>
<!-- assinatura: much+ · delivery much, branco direto no fundo (pílula translúcida lavava o logo) -->
<image href="asset:logos/much-plus-branco.png" x="296" y="313" width="176" height="50"/>
<line x1="504" y1="314" x2="504" y2="362" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
<image href="asset:logos/dm-h-branca.png" x="536" y="320" width="250" height="50"/>
<!-- receita A: frase mista -->
<text x="540" y="510" text-anchor="middle" font-size="72" fill="#FFFFFF"><tspan class="leve">todo mês tem </tspan><tspan class="forte">cupom</tspan></text>
<text x="540" y="606" text-anchor="middle" font-size="72" fill="#FFFFFF"><tspan class="leve">pra você </tspan><tspan class="forte">economizar!</tspan></text>
<!-- receita C: lockup de valor -->
<g id="produto">
  <text x="278" y="782" text-anchor="end" class="forte" font-size="56" fill="#FFFFFF">ATÉ</text>
  <text x="278" y="908" text-anchor="end" class="hero" font-size="110" fill="#FFFFFF">R$</text>
  <text x="295" y="1000" class="hero" font-size="360" data-campo="desconto_valor" fill="#FFFFFF">10</text>
  <text x="635" y="848" class="forte" font-size="150" fill="#FFFFFF">OFF</text>
  <text x="635" y="935" class="forte" font-size="56" fill="#FFFFFF">EM CADA</text>
  <text x="635" y="1000" class="forte" font-size="56" fill="#FFFFFF">CUPOM</text>
</g>
<!-- card branco com borda amarela (ref. inapp-much-descontos-cidade) -->
<g filter="url(#sh)"><rect x="100" y="1090" width="880" height="280" rx="36" fill="#FFFFFF" stroke="#FFB900" stroke-width="6"/></g>
<image href="asset:logos/much-plus-icone-app.png" x="140" y="1130" width="200" height="200"/>
<g id="detalhes">
  <text x="380" y="1210" class="hero" font-size="76" fill="#E52676" data-campo="detalhes">5 CUPONS</text>
  <text x="382" y="1268" class="body" font-size="38" fill="#434343">todo mês, pra usar</text>
  <text x="382" y="1316" class="body" font-size="38" fill="#434343">como quiser</text>
</g>
<!-- tickets much+ inclinados rompendo a borda do card (ref. inapp-much-mandou-bem / descontos-cidade) -->
<g transform="rotate(-16 900 1235)" filter="url(#shs)"><image href="asset:cupons/cupom-much-plus.png" x="790" y="1130" width="240" height="216"/></g>
<g transform="rotate(14 960 1340)" filter="url(#shs)"><image href="asset:cupons/cupom-much-plus.png" x="880" y="1270" width="170" height="153"/></g>
<!-- estrelas amarelas ladeando o valor -->
<image href="asset:elementos/estrela-amarela.png" x="930" y="700" width="66" height="77"/>
<image href="asset:elementos/estrela-amarela.png" x="96" y="960" width="44" height="51"/>
<!-- CTA da sub-marca: pílula amarela -->
<rect x="200" y="1450" width="680" height="110" rx="55" fill="#FFB900" filter="url(#shs)"/>
<text x="540" y="1525" text-anchor="middle" class="forte" font-size="56" fill="#E52676">conhecer o much+</text>
<text x="540" y="1640" text-anchor="middle" class="legal" font-size="26" fill="#FFFFFF">Exclusivo para assinantes much+. Consulte as regras no app.</text>
</svg>
