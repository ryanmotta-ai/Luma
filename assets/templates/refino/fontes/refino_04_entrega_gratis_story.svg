  <text x="100" y="1000" class="hero" font-size="380" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">GRÁTIS</text>
</g>
<text x="100" y="1078" class="body" font-size="42" fill="#FFFFFF">em pedidos acima de R$ 40 no app</text>
<g id="foto_produto"><rect x="100" y="1150" width="880" height="370" rx="56" fill="#D9D9D9"/>
<g transform="translate(540,1310)">
