<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Badge circular para logo da loja/restaurante parceiro (ex: PIZZAS BORCELLE) -->
  <defs>
    <filter id="badge-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- Borda branca externa de destaque -->
    <circle cx="100" cy="100" r="94" fill="#FFFFFF"/>
    <!-- Fundo marrom café profundo ou customizável -->
    <circle cx="100" cy="100" r="86" fill="#3D1E14"/>
    <!-- Área de substituição da logo do restaurante parceiro -->
    <!-- Variável: {{logo_parceiro}} -->
    <g transform="translate(100, 100)">
      <circle cx="0" cy="0" r="76" fill="none" stroke="#FFB900" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
      <text x="0" y="-8" text-anchor="middle" 
            font-family="'Realce', 'Impact', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
        PIZZAS
      </text>
      <text x="0" y="20" text-anchor="middle" 
            font-family="'Realce', 'Impact', sans-serif" font-size="18" font-weight="900" fill="#FFB900" letter-spacing="1">
        BORCELLE
      </text>
    </g>
  </g>
</svg>
