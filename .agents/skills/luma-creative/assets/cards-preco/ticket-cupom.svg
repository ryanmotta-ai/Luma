<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250">
  <!-- Bilhete / Ticket oficial de cupom Delivery Much -->
  <defs>
    <filter id="ticket-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#434343" flood-opacity="0.25"/>
    </filter>
  </defs>

  <defs><clipPath id="ticket-forma"><path d="M 30 0 L 650 0 C 665 0 680 15 680 30 C 655 55 655 85 680 110 C 655 135 655 165 680 190 C 655 215 655 240 680 250 L 30 250 C 15 250 0 235 0 220 C 25 195 25 165 0 140 C 25 115 25 85 0 60 C 25 35 25 15 0 0 Z"/></clipPath></defs>
  <g filter="url(#ticket-shadow)">
    <!-- Tudo recortado pela silhueta; a moldura #FF9000 é redesenhada por cima como traço de 28 (14 visíveis).
         Assim a borda tem a mesma espessura nas ondas dos DOIS lados — a aba desenhada à parte vazava
         pela moldura no lado esquerdo e deixava "dentes" laranja (revisão de 10/2026). -->
    <g clip-path="url(#ticket-forma)">
      <rect width="680" height="250" fill="#FFFFFF"/>
      <!-- Aba esquerda com a palavra CUPOM (#F62900, faixa lateral de cupom — §3 item 7) -->
      <rect width="144" height="250" fill="#F62900"/>
      <path d="M 30 0 L 650 0 C 665 0 680 15 680 30 C 655 55 655 85 680 110 C 655 135 655 165 680 190 C 655 215 655 240 680 250 L 30 250 C 15 250 0 235 0 220 C 25 195 25 165 0 140 C 25 115 25 85 0 60 C 25 35 25 15 0 0 Z" fill="none" stroke="#FF9000" stroke-width="28"/>
    </g>
    <g transform="translate(14, 12)">
      <text x="-113" y="82" transform="rotate(-90)" text-anchor="middle" 
            font-family="'Realce', 'Impact', sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="3">
        CUPOM
      </text>

      <!-- Código do Cupom (Variável: {{codigo_cupom}}) -->
      <g transform="translate(385, 120)">
        <text x="0" y="0" text-anchor="middle" 
              font-family="'Realce', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#F85400" letter-spacing="1">
          NOMEDOUCUPOM
        </text>
        <line x1="-190" y1="20" x2="190" y2="20" stroke="#FFB900" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
