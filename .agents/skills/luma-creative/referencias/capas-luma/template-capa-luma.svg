<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400" data-luma="1">
  <defs>
    <style>
      @font-face {
        font-family: 'Realce';
        src: url('asset:fontes/realce-black.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Roboto';
        src: url('asset:fontes/Roboto-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'Roboto';
        src: url('asset:fontes/Roboto-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
    </style>
    <filter id="sticker-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#434343" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo Sólido Oficial DM -->
  <rect width="750" height="400" fill="#F85400"/>

  <!-- Lockup Central Inclinado (Sticker Retail) -->
  <g transform="translate(375, 175) rotate(-8)" filter="url(#sticker-shadow)" text-anchor="middle">
    
    <!-- Tag Superior / Pré-título -->
    <g transform="translate(0, -58)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#F62900"/>
      <text y="7" font-family="'Roboto', sans-serif" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="1">AQUI TEM</text>
    </g>

    <!-- Palavra Principal (Sticker Hero) -->
    <text x="0" y="24" font-family="'Realce', sans-serif" font-weight="900" font-size="74" fill="#F85400" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" paint-order="stroke fill" letter-spacing="0.5" data-campo="titulo">CUPONS</text>

    <!-- Tag Inferior / Complemento -->
    <g transform="translate(0, 56)">
      <rect x="-100" y="-18" width="200" height="36" rx="10" fill="#FFFFFF"/>
      <text y="7" font-family="'Roboto', sans-serif" font-weight="500" font-size="22" fill="#F85400" letter-spacing="0.5">EXCLUSIVOS</text>
    </g>
  </g>

  <!-- Assinatura Inferior Centralizada -->
  <image href="asset:logos/dm-h-branca.png" x="288" y="336" width="174" height="35" preserveAspectRatio="xMidYMid meet"/>
</svg>
