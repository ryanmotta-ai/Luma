<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luma — regressão do importador PSD</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#111;color:#f5f5f5}
    body{max-width:920px;margin:40px auto;padding:0 24px}
    h1{font-size:24px;margin-bottom:8px}.summary{color:#aaa;margin-bottom:24px}
    ol{list-style:none;padding:0;display:grid;gap:8px}.case{padding:12px 14px;border:1px solid #333;border-radius:10px;background:#181818}
    .pass{border-color:#276b42}.fail{border-color:#a33;background:#2a1515}.case strong{display:block}.case small{color:#bbb}
  </style>
</head>
<body>
  <h1>Regressão do importador PSD</h1>
  <div class="summary" id="summary">Executando no motor real do navegador…</div>
  <ol id="results"></ol>
  <script src="../js/00-config.js"></script>
  <!-- core/layout.js é parte da cadeia do import: `_dPsdReflowToFmt` e `dImportLayersAsArtboard`
       levam as camadas do tamanho nativo do PSD para o preset escolhido por `gReflowLayers`.
       Arquivo puro, sem efeito colateral no boot. -->
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/auto-layout.js"></script>
  <script src="../js/designer/blending.js"></script>
  <!-- fonts.js traz o catálogo REAL (dBuiltinFonts) que `_dPsdFontResolve` consulta para
       decidir entre fonte exata, aproximada, substituída e ausente. Só declarações: nada roda
       no load, então entra na suíte sem efeito colateral. -->
  <script src="../js/designer/fonts.js"></script>
  <script src="../js/designer/psd-parse.js"></script>
  <!-- O selo de fidelidade (_dPsdFidelity/_dPsdShowFidelity) mora na metade de tela do
       importador. Carrega sem efeito colateral: o arquivo só declara funções. -->
  <script src="../js/designer/psd-import.js"></script>
  <script src="psd-import-cases.js"></script>
</body>
</html>
