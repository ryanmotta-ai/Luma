(async()=>{
const failures=[];let total=0;
const assert=(x,m)=>{if(!x)throw new Error(m||'asserção falhou');};
async function test(name,fn){
  total++;
  window.__lumaCurrentTest = name;
  try{

const espera = ms => new Promise(r => setTimeout(r, ms));

async function esperaCondicao(fn, msg='condição', timeout=4000){
  const t0 = Date.now();
  while(Date.now() - t0 < timeout){
    try{ if(fn()) return true; }catch(e){}
    await espera(25);
  }
  throw new Error(`Timeout (${timeout}ms) esperando ${msg}`);
}

async function esperaElemento(seletor, timeout=4000){
  await esperaCondicao(() => !!document.querySelector(seletor), `elemento ${seletor}`, timeout);
  return document.querySelector(seletor);
}

const LAYERS=[
  {id:'fundo',name:'Fundo',type:'shape',shapeKind:'rect',x:0,y:0,w:1080,h:1920,fill:'#E8231A',visible:true,opacity:100},
  {id:'produto',name:'Produto',type:'text',content:'{{produto}}',isVar:true,x:90,y:400,w:900,h:180,
   font:'Arial',fontSize:90,lineHeight:1.05,textAlign:'left',textBox:'box',visible:true,opacity:100},
  {id:'de',name:'De',type:'text',content:'{{precoDe}}',isVar:true,x:90,y:700,w:340,h:60,
   font:'Arial',fontSize:38,lineHeight:1.2,textAlign:'left',textBox:'point',visible:true,opacity:100},
  {id:'por',name:'Por',type:'text',content:'{{precoPor}}',isVar:true,x:470,y:672,w:400,h:110,
   font:'Arial',fontSize:84,lineHeight:1.1,textAlign:'left',textBox:'point',visible:true,opacity:100},
  {id:'foto',name:'Foto',type:'frame',imgVar:'foto_produto',x:90,y:1000,w:900,h:700,visible:true,opacity:100}
];

const mockTemplate=(id, nome)=>({
  id: id || 'tmpl-fuzz-1',
  name: nome || 'Material de Fuzzing',
  fmt:'story',w:1080,h:1920,
  layers:JSON.parse(JSON.stringify(LAYERS)),
  publishMeta:{publicado:true,permissoes:{}}
});

function resetMaratona(){
  try{ clearTimeout(fNextTimeout); }catch(e){}
  try{ clearTimeout(_fGuidedTimer); }catch(e){}
  try{ localStorage.clear(); }catch(e){}
  _fGuidedDesativar();
  _fRevisando = false;
  fState.stepIdx = -1;
  fState.dados = {};
  fState.done = false;
  fState.editIdx = null;
  fState.extractedColors = {};
  fState.material = null;
  fState.camp = null;
  fState._lastHistId = null;
  if(typeof _fArtSnapshots !== 'undefined') _fArtSnapshots = {};
  if(typeof _fArtCaptions !== 'undefined') _fArtCaptions = {};
  document.getElementById('f-messages').innerHTML='';
  document.getElementById('f-respostas').innerHTML='';
  document.getElementById('f-respostas').hidden=true;
  const box=document.getElementById('f-msg-box');
  if(box){ box.value=''; box.disabled=false; }
  window.gConfirm = async () => true; // auto-confirmação para testes não interativos
  dFolders = [
    {
      id: 'folder-fuzz-1',
      campId: 'camp-fuzz-1',
      name: 'Campanha Fuzz 1',
      color: '#FF9000',
      templates: [mockTemplate('tmpl-fuzz-1', 'Template Fuzz 1'), mockTemplate('tmpl-fuzz-1b', 'Template Fuzz 1B')]
    },
    {
      id: 'folder-fuzz-2',
      campId: 'camp-fuzz-2',
      name: 'Campanha Fuzz 2',
      color: '#0070F3',
      templates: [mockTemplate('tmpl-fuzz-2', 'Template Fuzz 2')]
    }
  ];
}

async function salvarCampo(val){
  _fGuidedSalvar(val);
  await espera(320); // 320ms garante ultrapassar o timer de 260ms do _fGuidedTimer
}

/* ══════════════════════════════════════════════════════════════════════════════════════════
   1. FUZZING DE TEXTO: MAXLEN, EMOJIS, RTL E INJEÇÕES
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 1: Texto excessivo é barrado pela validação com mensagem clara sem travar a UI', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  const textoGigante = 'Luma Promoção '.repeat(200); // 2.600 chars
  const erro = fValidate('produto', textoGigante);
  assert(erro && erro.includes('muito longo'), 'fValidate deve retornar mensagem de erro para texto excessivo');
  
  // No campo inteligente do input, colagem é cortada automaticamente no maxLen
  const box = document.getElementById('f-msg-box');
  const cfg = fGetFieldType('produto');
  box.value = textoGigante.slice(0, cfg.maxLen);
  assert(box.value.length <= cfg.maxLen, 'texto no input deve ser limitado a maxLen');
});

await test('Fuzz 2: Emojis complexos (ZWJ, modificadores de pele e bandeiras)', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  const emojis = '🍔🔥 Promoção 👨‍👩‍👧‍👦 Top 🏳️‍🌈 Pizza 🇧🇷 👋🏿';
  await salvarCampo('data:image/png;base64,x');
  await salvarCampo(emojis);
  await salvarCampo('30');
  await salvarCampo('15');
  
  await esperaCondicao(()=>fState.done===true, 'arte concluída com emojis');
  assert(fState.dados.produto === emojis, 'emojis preservados exatamente');
});

await test('Fuzz 3: Caracteres RTL (Árabe, Hebraico) e controle Unicode não invertem a UI', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  const rtl = '\u202E\u200Fعرض خاص جداً \u200Eمرحباً\u202C'; // RTL overrides
  await salvarCampo('data:image/png;base64,x');
  await salvarCampo(rtl);
  await salvarCampo('40');
  await salvarCampo('20');
  
  await esperaCondicao(()=>fState.done===true, 'arte concluída com RTL');
  const card = await esperaElemento('.art-wrap');
  assert(card, 'card renderizado');
});

await test('Fuzz 4: Payloads maliciosos de injeção de template, HTML e script', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  const payload = '"><scr' + 'ipt>window.__injected=1</scr' + 'ipt>${7*7}{{toString()}}<img src=x onerror=window.__injected=2>';
  await salvarCampo('data:image/png;base64,x');
  await salvarCampo(payload);
  await salvarCampo('50');
  await salvarCampo('30');
  
  await esperaCondicao(()=>fState.done===true, 'arte concluída');
  assert(!window.__injected, 'script malicioso NÃO deve ter executado no contexto da página');
  
  // Confere na lista de revisão
  fVoltarParaEdicao();
  const lista = await esperaElemento('#f-respostas:not([hidden])');
  assert(!lista.querySelector('script'), 'tag script não foi montada como nó vivo');
  assert(!window.__injected, 'script continuou inerte na revisão');
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   2. FUZZING DE VALORES MONETÁRIOS E NÚMEROS ANÔMALOS
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 5: Fuzzing agressivo do parser de preços e máscaras', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  const casosPreco = [
    { in: 'R$ 0,00', ok: false }, // regra de negócio: preço zerado rejeita
    { in: 'Grátis', ok: true },   // item de graça aceita com palavra explícita
    { in: '123456789', ok: true },
    { in: '12.345,67', ok: true },
    { in: '99,99', ok: true },
    { in: '... ,,,', ok: false }, // só pontuação
    { in: 'cem reais', ok: false }, // só texto
    { in: '   ', ok: false }
  ];
  
  for(const c of casosPreco){
    const mascarado = fApplyMask('precoPor', c.in);
    const erro = fValidate('precoPor', mascarado);
    if(c.ok){
      assert(!erro, `valor "${c.in}" deveria ser aceito, mas deu erro: ${erro}`);
    } else {
      assert(erro, `valor inválido "${c.in}" deveria ser rejeitado pela validação`);
    }
  }
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   3. FUZZING DE IMAGENS: BASE64 CORROMPIDO, DIMENSÕES ZERO E ERROS DE REDE
   ══════════════════════════════════════════════════════════════════════════════════════════ */

  await salvarCampo(corrompida);
  await salvarCampo('Produto Teste Img');
  await salvarCampo('40');
  await salvarCampo('20');
  
  // Deve gerar a arte sem estourar exceção não tratada

});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   4. CONCORRÊNCIA, HAMMERING E DISPAROS EM RAJADA (DOUBLE CLICK)
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 7: Disparos de salvamento em rajada não quebram o cursor', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  // Salva foto e aguarda
  _fGuidedSalvar('data:image/png;base64,x');
  await espera(320);
  
  // Deve ter avançado ordenadamente para o próximo campo (produto)
  assert(_fGuidedNav.currentField === 'produto', `deveria estar no campo produto, atual: ${_fGuidedNav.currentField}`);
});

await test('Fuzz 8: Navegação reversa via fGoBack não corrompe o índice', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  // No Desktop Guided
  _fGuidedSalvar('data:image/png;base64,x'); await espera(320);
  assert(_fGuidedNav.currentField === 'produto', 'no campo 2');
  
  // Volta um passo
  fGoBack();
  await espera(100);
  assert(_fGuidedNav.currentField === 'foto_produto', 'voltou para o campo 1');
  
  // Tenta voltar mais uma vez quando já está no primeiro campo
  fGoBack();
  await espera(100);
  assert(_fGuidedNav.currentField === 'foto_produto', 'permaneceu no campo 1 sem erro');
});

await test('Fuzz 9: Clique duplo / múltiplo em Baixar PNG não duplica exportação', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  await salvarCampo('data:image/png;base64,x');
  await salvarCampo('Burger Double Download');
  await salvarCampo('30');
  await salvarCampo('15');
  
  await esperaCondicao(()=>fState.done===true);
  const btn = await esperaElemento('.art-download');
  
  let chamadasGenPNG = 0;
  const origGen = window.fGenPNG;
  window.fGenPNG = async () => {
    chamadasGenPNG++;
    await espera(100);
    return 'data:image/png;base64,x';
  };
  
  try {
    const m = (btn.getAttribute('onclick')||'').match(/fBaixar\(this,\s*'([^']+)'\)/);
    const snapId = m ? m[1] : Object.keys(_fArtSnapshots)[0];
    
    // Dispara 3 cliques concorrentes
    fBaixar(btn, snapId);
    fBaixar(btn, snapId);
    await espera(300);
    
    assert(chamadasGenPNG >= 1, 'fGenPNG foi chamado');
  } finally {
    window.fGenPNG = origGen;
  }
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   5. NAVEGAÇÃO ENTRE CAMPANHAS E MATERIAIS SOB ESTRESSE
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 10: Alternância ultra-rápida entre campanhas e templates', async()=>{
  resetMaratona();
  
  for(let i=0; i<3; i++){
    fSelectCamp('camp-fuzz-1');
    await fSelectMaterial('tmpl-fuzz-1');
    fSelectCamp('camp-fuzz-2');
    await fSelectMaterial('tmpl-fuzz-2');
    fSelectCamp('camp-fuzz-1');
    await fSelectMaterial('tmpl-fuzz-1b');
  }
  
  // No final deve estar estritamente no material 1B da campanha 1
  assert(fState.camp.id === 'camp-fuzz-1', 'campanha final deve ser camp-fuzz-1');
  assert(fState.material.id === 'tmpl-fuzz-1b', 'material final deve ser tmpl-fuzz-1b');
  assert(fState.camp.perguntas && fState.camp.perguntas.length > 0, 'perguntas montadas corretamente');
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   6. RESILIÊNCIA CONTRA LOCALSTORAGE CORROMPIDO OU CHEIO
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 11: Rascunho com JSON corrompido no localStorage não causa tela branca', async()=>{
  resetMaratona();
  localStorage.setItem('luma_chat_draft', '{{INVALID JSON CORROMPIDO');
  
  // Deve abrir normalmente sem estourar SyntaxError fatal
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  assert(fState.material && fState.material.id === 'tmpl-fuzz-1', 'abriu material mesmo com rascunho corrompido');
});

await test('Fuzz 12: QuotaExceededError no localStorage é tratado com elegância', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  // Simula disco cheio no localStorage
  const origSetItem = localStorage.setItem;
  localStorage.setItem = () => {
    const err = new Error('Quota exceeded');
    err.name = 'QuotaExceededError';
    throw err;
  };
  
  try {
    // Tenta salvar e concluir arte
    await salvarCampo('data:image/png;base64,x');
    await salvarCampo('Pizza Sem Espaço no Disco');
    await salvarCampo('50');
    await salvarCampo('30');
    
    await esperaCondicao(()=>fState.done===true, 'concluiu com sucesso apesar de QuotaExceeded');
    assert(fState.dados.produto === 'Pizza Sem Espaço no Disco', 'dados em memória preservados');
  } finally {
    localStorage.setItem = origSetItem;
  }
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   7. REINÍCIO COMPLETO (REFAZER ARTE)
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fuzz 13: Refazer arte (fRefazer) limpa 100% dos dados e rascunhos', async()=>{
  resetMaratona();
  fSelectCamp('camp-fuzz-1');
  await fSelectMaterial('tmpl-fuzz-1');
  
  await salvarCampo('data:image/png;base64,x');
  await salvarCampo('Arte Para Apagar');
  await salvarCampo('40');
  await salvarCampo('20');
  await esperaCondicao(()=>fState.done===true);
  
  // Mocka confirmação e clica em Refazer
  window.gConfirm = async () => true;
  await fRefazer();
  await espera(200);
  
  // Estado deve ter sido zerado
  assert(fState.done === false, 'fState.done deve ser false');
  assert(Object.keys(fState.dados).length === 0, 'fState.dados deve estar vazio');
  assert(localStorage.getItem('luma_chat_draft') === null, 'rascunho apagado do localStorage');
});

window.__lumaTest={total,passed:total-failures.length,failures};
})().catch(e=>window.__lumaTest={total:1,passed:0,failures:[{name:'maratona-fuzz',error:e.stack}]});
