<title>Luma — Copy Fit na interface do franqueado</title>

<body class="theme-light"><h1>Copy Fit — balão, diálogo "não cabe" e Encurtar do chat</h1><ol id="results"></ol>

<!-- ══════════════════════════════════════════════════════════════════════════════════════════
     POR QUE ESTA SUÍTE EXISTE
     ------------------------------------------------------------------------------------------
     `tests/copy-fit.html` cobra o MOTOR (o que ele sugere). Esta cobra as três PORTAS por onde a
     sugestão chega ao franqueado — o balão da prévia, o diálogo "Esse texto não cabe" e o
     "Encurtar" do chat — com os módulos reais (chat.js, chat-input.js, live-preview.js,
     toast.js, local-fit.js, copy-fit.js) e a arte medida de verdade pelo Local Fit.
     Tudo aqui foi verificado à mão antes (35fb5ec, 2470e6b, df5cdec, 4cb4f29) e cada defeito
     achado naquela rodada é um caso de regressão: Desfazer, sugestão velha, culpado único,
     percorrer bloqueios, estado vazio, Enter no botão focado, IA lenta, balão que pisca.
     Casos em `copy-fit-ui-cases.js`. Sem relógio de verdade: a prévia é chamada direto e o
     debounce da digitação é descartado — a suíte roda em poucos segundos.
     ══════════════════════════════════════════════════════════════════════════════════════════ -->

<!-- Palco mínimo: os nós que o chat e a prévia procuram por id (mesmo palco de franqueado-fluxo.html,
     mais o `#f-input-wrap`, que é onde o botão Encurtar e o popover moram). -->

<span id="lp-dim"></span><span id="lp-sub"></span><button type="button" id="lp-layout-nota" hidden></button>
<div id="f-preview-modal"><div id="pv-title"></div><div id="pv-note"></div><div id="pv-multi"></div></div>
<div id="g-toast-container"></div>
<div id="f-head-actions"><button id="f-undo-btn" hidden onclick="fDesfazer()"></button></div>
