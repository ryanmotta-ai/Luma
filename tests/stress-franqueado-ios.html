const origMatchMedia = window.matchMedia;
window.matchMedia = function(q){
  if(q.includes('max-width') || q.includes('hover: none') || q.includes('hover:none')){

const espera = ms => new Promise(r => setTimeout(r, ms));

async function esperaCondicao(fn, msg='condição', timeout=4000){
  const t0 = Date.now();
  while(Date.now() - t0 < timeout){
    try{ if(fn()) return true; }catch(e){}
    await espera(30);
  }
  throw new Error(`Timeout (${timeout}ms) esperando ${msg}`);
}

async function esperaElemento(seletor, timeout=4000){
  await esperaCondicao(() => !!document.querySelector(seletor), `elemento ${seletor}`, timeout);
  return document.querySelector(seletor);
}

await test('iOS 3: Preenchimento sequencial de texto e imagem via chat timeline', async()=>{
  setupFixtureIOS();
  fSelectCamp('camp-ios-1');
  await fSelectMaterial('tmpl-ios-1');
  if(document.getElementById('prestart-msg')) fSkipPreStart();
  
  // Aguarda primeiro passo
  await esperaCondicao(()=>fState.stepIdx === 0, 'fState.stepIdx === 0');
  const p0 = fState.camp.perguntas[0];
  assert(p0.isImage, 'primeiro passo deve ser imagem foto_produto');
  
  // Confirma imagem
  fState.dados[p0.id] = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  fConfirmarImagem(p0.id);
  
  // Passo 2: produto
  await esperaCondicao(()=>fState.stepIdx === 1, 'fState.stepIdx === 1');
  const box = document.getElementById('f-msg-box');
  box.value = 'Combo Burger iOS';
  fSend();
  
  // Passo 3: precoDe
  await esperaCondicao(()=>fState.stepIdx === 2, 'fState.stepIdx === 2');
  box.value = '42,00';
  fSend();
  
  // Passo 4: precoPor (último passo)
  await esperaCondicao(()=>fState.stepIdx === 3, 'fState.stepIdx === 3');
  box.value = '29,90';
  fSend();
  
  // Aguarda fGerarArte e montagem do card
  await esperaCondicao(()=>fState.done === true, 'fState.done === true no iOS');
  const card = await esperaElemento('.art-wrap');
  assert(card, 'card da arte pronta renderizado no iOS');
  assert(fState.dados.produto === 'Combo Burger iOS', 'produto salvo');
  assert(fState.dados.precoPor.includes('29,90'), 'precoPor formatado com mascara');
});

await test('iOS 5: Download via folha nativa (navigator.share) no Safari iOS', async()=>{
  setupFixtureIOS();
  fSelectCamp('camp-ios-1');
  await fSelectMaterial('tmpl-ios-1');
  if(document.getElementById('prestart-msg')) fSkipPreStart();
  
  fState.dados['foto_produto'] = 'data:image/png;base64,x'; fConfirmarImagem('foto_produto');
  await esperaCondicao(()=>fState.stepIdx === 1);
  document.getElementById('f-msg-box').value = 'Share iOS Teste'; fSend();
  await esperaCondicao(()=>fState.stepIdx === 2);
  document.getElementById('f-msg-box').value = '30'; fSend();
  await esperaCondicao(()=>fState.stepIdx === 3);
  document.getElementById('f-msg-box').value = '20'; fSend();
  
  await esperaCondicao(()=>fState.done === true);
  const btnBaixar = await esperaElemento('.art-download');
  
  // Mock da folha nativa do iOS (navigator.share e navigator.canShare)
  let compartilhouNativo = false;
  navigator.canShare = ({files}) => !!(files && files.length);
  navigator.share = async ({files, text, title}) => {
    compartilhouNativo = true;
    assert(files && files.length > 0, 'arquivos enviados para o share do iOS');
    return Promise.resolve();
  };
  
  const m = (btnBaixar.getAttribute('onclick')||'').match(/fBaixar\(this,\s*'([^']+)'\)/);
  const snapId = m ? m[1] : Object.keys(_fArtSnapshots)[0];
  
  await fBaixar(btnBaixar, snapId);
  
  assert(compartilhouNativo === true, 'navigator.share foi chamado com a imagem no iOS');
  const hist = fGetHist();
  assert(hist.length > 0 && hist[0].status === 'baixada', 'histórico gravado como baixada');
});

await test('iOS 6: Fallback automático de download quando o share é recusado', async()=>{
  setupFixtureIOS();
  fSelectCamp('camp-ios-1');
  await fSelectMaterial('tmpl-ios-1');
  if(document.getElementById('prestart-msg')) fSkipPreStart();
  
  fState.dados['foto_produto'] = 'data:image/png;base64,x'; fConfirmarImagem('foto_produto');
  await esperaCondicao(()=>fState.stepIdx === 1);
  document.getElementById('f-msg-box').value = 'Fallback iOS Teste'; fSend();
  await esperaCondicao(()=>fState.stepIdx === 2);
  document.getElementById('f-msg-box').value = '30'; fSend();
  await esperaCondicao(()=>fState.stepIdx === 3);
  document.getElementById('f-msg-box').value = '20'; fSend();
  
  await esperaCondicao(()=>fState.done === true);
  const btnBaixar = await esperaElemento('.art-download');
  
  // Simula Safari recusando o share (ex: perda do user gesture transitório)
  navigator.canShare = () => true;
  navigator.share = async () => {
    const err = new Error('User gesture was not present');
    err.name = 'NotAllowedError';
    throw err;
  };
  
  let clicouDownloadLink = false;
  const origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    if(this.download) clicouDownloadLink = true;
    return origClick.apply(this, arguments);
  };
  
  try {
    const m = (btnBaixar.getAttribute('onclick')||'').match(/fBaixar\(this,\s*'([^']+)'\)/);
    const snapId = m ? m[1] : Object.keys(_fArtSnapshots)[0];
    await fBaixar(btnBaixar, snapId);
    
    assert(clicouDownloadLink === true, 'fallback disparou download por Blob via <a download>');
    const hist = fGetHist();
    assert(hist.length > 0 && hist[0].status === 'baixada', 'marcou como baixada mesmo no fallback');
  } finally {
    HTMLAnchorElement.prototype.click = origClick;
  }
});
