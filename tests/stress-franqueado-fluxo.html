(async()=>{
const failures=[];let total=0;
const assert=(x,m)=>{if(!x)throw new Error(m||'asserção falhou');};
async function test(name,fn){total++;try{await fn();
    document.getElementById('results').insertAdjacentHTML('beforeend','<li>OK '+gEsc(name)+'</li>');}
  catch(e){failures.push({name,error:e.message});
    document.getElementById('results').insertAdjacentHTML('beforeend','<li>FALHOU '+gEsc(name)+': '+gEsc(e.message)+'</li>');}}

const espera=ms=>new Promise(r=>setTimeout(r,ms));

async function esperaCondicao(fn, msg='condição', timeout=4000){
  const t0 = Date.now();
  while(Date.now() - t0 < timeout){
    try {
      if(fn()) return true;
    } catch(e){}
    await espera(30);
  }
  throw new Error(`Timeout (${timeout}ms) esperando ${msg}`);
}

async function esperaElemento(seletor, timeout=4000){
  await esperaCondicao(() => !!document.querySelector(seletor), `elemento ${seletor}`, timeout);
  return document.querySelector(seletor);
}

const LAYERS=[
  {id:'fundo',name:'Fundo',type:'shape',shapeKind:'rect',x:0,y:0,w:1080,h:1920,fill:'#E8231A',visible:true,opacity:100},
  {id:'produto',name:'Produto',type:'text',content:'{{produto}}',isVar:true,x:90,y:400,w:900,h:180,
   font:'Arial',fontSize:90,lineHeight:1.05,textAlign:'left',textBox:'box',visible:true,opacity:100},
  {id:'de',name:'De',type:'text',content:'{{precoDe}}',isVar:true,x:90,y:700,w:340,h:60,

  {id:'por',name:'Por',type:'text',content:'{{precoPor}}',isVar:true,x:470,y:672,w:400,h:110,
   font:'Arial',fontSize:84,lineHeight:1.1,textAlign:'left',textBox:'point',visible:true,opacity:100},

];

const mockTemplate=()=>({id:'tmpl-stress-1',name:'Super Promoção de Teste',fmt:'story',w:1080,h:1920,
  layers:JSON.parse(JSON.stringify(LAYERS)),publishMeta:{publicado:true,permissoes:{}}});

function setupFixture(){
  try{clearTimeout(fNextTimeout);}catch(e){}
  try{clearTimeout(_fGuidedTimer);}catch(e){}
  try{localStorage.clear();}catch(e){}
  _fGuidedDesativar();
  _fRevisando = false;
  fState.stepIdx = -1;
  fState.dados = {};
  fState.done = false;
  fState.editIdx = null;
  fState.extractedColors = {};
  fState.material = null;
  fState.camp = null;
  fState._lastHistId = null;
  if(typeof _fArtSnapshots !== 'undefined') _fArtSnapshots = {};
  if(typeof _fArtCaptions !== 'undefined') _fArtCaptions = {};
  document.getElementById('f-messages').innerHTML='';
  document.getElementById('f-respostas').innerHTML='';
  document.getElementById('f-respostas').hidden=true;
  const box=document.getElementById('f-msg-box');
  if(box){box.value='';box.disabled=false;}
  dFolders = [{
    id: 'folder-1',
    campId: 'camp-1',
    name: 'Campanha de Estresse',
    color: '#FF9000',

  }];

/* ══════════════════════════════════════════════════════════════════════════════════════════
   1. FLUXO COMPLETO: Escolher Campanha → Preencher → Revisar → Baixar
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Fluxo 1: Selecionar campanha e material configura corretamente o estado', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  assert(fState.camp && fState.camp.id==='camp-1','campanha não selecionada');
  const mat = dFolders[0].templates[0];
  await fSelectMaterial(mat.id);
  assert(fState.material && fState.material.id===mat.id,'material não selecionado');
  assert(fState.camp.perguntas && fState.camp.perguntas.length>=4,'perguntas não geradas');
});

await test('Fluxo 2 (Desktop): Preencher todos os passos via Guided', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  const mat = dFolders[0].templates[0];
  await fSelectMaterial(mat.id);
  
  assert(_fGuidedAtivo(),'desktop guided deveria estar ativo');
  
  // Se houver tela de pré-início, pula para começar do zero
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  // Passo 1 (peso 10): foto_produto
  _fGuidedSalvar('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==');
  await espera(320);
  assert(fState.dados.foto_produto && fState.dados.foto_produto.startsWith('data:image'),'foto não salva: '+JSON.stringify(fState.dados));
  
  // Passo 2 (peso 20): produto
  _fGuidedSalvar('Hambúrguer Smash Especial');
  await espera(320);
  assert(fState.dados.produto==='Hambúrguer Smash Especial','produto não salvo: '+JSON.stringify(fState.dados));
  
  // Passo 3 (peso 30): precoDe
  _fGuidedSalvar('39,90');
  await espera(320);
  assert(fState.dados.precoDe.includes('39,90'),'precoDe não salvo com máscara: '+fState.dados.precoDe);
  
  // Passo 4 (peso 40): precoPor (último passo)
  _fGuidedSalvar('24,90');
  
  // Aguarda fGerarArte assíncrono e renderização do card
  await esperaCondicao(()=>fState.done===true,'fState.done===true após último passo');
  const card = await esperaElemento('.art-wrap');
  assert(card,'card da arte pronta não renderizado');
});

await test('Fluxo 3 (Desktop): Abrir revisão após arte pronta e alterar campo', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  // Preenche tudo na ordem
  _fGuidedSalvar('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='); await espera(320);
  _fGuidedSalvar('Pizza Artesanal'); await espera(320);
  _fGuidedSalvar('60'); await espera(320);
  _fGuidedSalvar('45');
  await esperaCondicao(()=>fState.done===true,'arte pronta');
  await esperaElemento('.art-wrap');
  
  // Usuário clica em "Editar arte" (fVoltarParaEdicao)
  fVoltarParaEdicao();
  await esperaCondicao(()=>_fRevisando===true,'_fRevisando ativo');
  assert(fState.done===false,'done não foi desativado para revisão');
  
  const lista = await esperaElemento('#f-respostas:not([hidden])');
  assert(lista.textContent.includes('Pizza Artesanal'),'lista não mostra o valor atual do produto');
  assert(lista.textContent.includes('45,00'),'lista não mostra o preço atual');
  
  // Edita o campo do produto
  const idxProd = fState.camp.perguntas.findIndex(p=>p.id==='produto');
  fRespostaEditar(idxProd);
  await espera(100);
  
  assert(_fGuidedNav.mode==='field-edit','modo não é field-edit');
  _fGuidedSalvar('Pizza Quatro Queijos Suprema');
  await espera(320);
  
  // Deve ter voltado para a lista de revisão
  assert(fState.dados.produto==='Pizza Quatro Queijos Suprema','produto não atualizado');
  assert(_fRevisando===true,'não voltou para revisão');
  
  // Concluir revisão
  fConcluirRevisao();
  await esperaCondicao(()=>fState.done===true,'concluir revisão não finalizou a arte');
  assert(_fRevisando===false,'_fRevisando ainda ativo após concluir');
});

await test('Fluxo 4: Baixar PNG executa sem erro e atualiza histórico', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  _fGuidedSalvar('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='); await espera(320);
  _fGuidedSalvar('Combo Smash'); await espera(320);
  _fGuidedSalvar('35'); await espera(320);
  _fGuidedSalvar('25');
  
  await esperaCondicao(()=>fState.done===true,'arte pronta');
  const btnBaixar = await esperaElemento('.art-download');
  assert(btnBaixar,'botão Baixar PNG não encontrado');
  
  let baixou=false;
  const fGenPNGReal = window.fGenPNG;
  window.fGenPNG = async (dados, camp, fmt) => {
    baixou = true;
    assert(dados.produto==='Combo Smash','dados incorretos no fGenPNG');
    return 'data:image/png;base64,fake';
  };
  
  try {
    const m = (btnBaixar.getAttribute('onclick')||'').match(/fBaixar\(this,\s*'([^']+)'\)/);
    const snapId = m ? m[1] : Object.keys(_fArtSnapshots)[0];
    await fBaixar(btnBaixar, snapId);
    assert(baixou===true,'fGenPNG não foi chamado pelo fBaixar');
    const hist = fGetHist();
    assert(hist.length>0,'histórico não salvo');
    assert(hist[0].status==='baixada','status no histórico não é baixada');
  } finally {
    window.fGenPNG = fGenPNGReal;
  }
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   2. ESTRESSE REPETITIVO: 10 Ciclos Completos de Criação e Revisão
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Estresse: 10 ciclos completos sem vazamento ou quebra de estado', async()=>{
  setupFixture();
  for(let i=1; i<=10; i++){
    fSelectCamp('camp-1');
    await fSelectMaterial(dFolders[0].templates[0].id);
    
    // Se no ciclo 2+ aparecer tela de pré-início, clica em Começar do Zero
    if(document.querySelector('.fg-decision')){
      fSkipPreStart();
      await espera(100);
    }
    
    // Preenche campos
    _fGuidedSalvar('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='); await espera(300);
    _fGuidedSalvar('Item '+i); await espera(300);
    _fGuidedSalvar(String(10+i)); await espera(300);
    _fGuidedSalvar(String(5+i));
    
    await esperaCondicao(()=>fState.done===true, `ciclo ${i}: arte não concluída`);
    assert(fState.dados.produto==='Item '+i, `ciclo ${i}: dados errados`);
    
    // Abre revisão
    fVoltarParaEdicao();
    await esperaCondicao(()=>_fRevisando===true, `ciclo ${i}: não entrou em revisão`);
    
    // Edita produto na revisão
    const idxP = fState.camp.perguntas.findIndex(p=>p.id==='produto');
    fRespostaEditar(idxP);
    await espera(100);
    _fGuidedSalvar('Item '+i+' Revisado');
    await espera(320);
    
    assert(fState.dados.produto==='Item '+i+' Revisado', `ciclo ${i}: edição na revisão falhou`);
    
    // Conclui
    fConcluirRevisao();
    await esperaCondicao(()=>fState.done===true, `ciclo ${i}: conclusão falhou`);
    await esperaElemento('.art-wrap');
    assert(_fRevisando===false, `ciclo ${i}: _fRevisando não desligou`);
  }
});

await test('Fluxo: Aproveitar informações da última arte (fUseLastArte)', async()=>{
  setupFixture();
  // Cria uma primeira arte
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  _fGuidedSalvar('data:image/png;base64,x'); await espera(300);
  _fGuidedSalvar('Prato Executivo'); await espera(300);
  _fGuidedSalvar('40'); await espera(300);
  _fGuidedSalvar('30');
  await esperaCondicao(()=>fState.done===true,'arte 1 pronta');
  await esperaElemento('.art-wrap');
  
  // Agora inicia uma segunda arte do mesmo material
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  
  // Deve exibir tela de pré-início oferecendo usar última arte
  assert(document.querySelector('.fg-decision'),'tela de pré-início não abriu');
  const hist = fGetHist();
  assert(hist.length>0 && hist[0].prod==='Prato Executivo','histórico com dados da arte 1');
  
  // Clica em usar última arte
  fUseLastArte(Number(hist[0].id));
  await espera(100);
  
  // Guided mostra tela de decisão com botão Continuar
  assert(fState.dados.produto==='Prato Executivo','dados não foram copiados');
  _fGuidedAbrirProximo(0);
  
  // Como todos os campos já estavam preenchidos, deve gerar a arte diretamente
  await esperaCondicao(()=>fState.done===true,'arte 2 pronta via reuso');
  assert(fState.dados.produto==='Prato Executivo','dados mantidos');
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   3. ESTRESSE DE CASOS DE BORDA
   ══════════════════════════════════════════════════════════════════════════════════════════ */
await test('Borda: Preço com caracteres especiais, letras e espaços não corrompe', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  const idxPreco = fState.camp.perguntas.findIndex(p=>p.id==='precoPor');
  _fGuidedNav.currentField = fState.camp.perguntas[idxPreco].id;
  
  // Tenta salvar valor sem dígitos
  _fGuidedSalvar('grana');
  assert(fState.dados.precoPor==null || fState.dados.precoPor==='','valor sem número não deveria ser aceito como preço');
  
  // Salva valor com '35.50'
  _fGuidedSalvar('35.50');
  assert(fState.dados.precoPor && fState.dados.precoPor.includes('35,50'),'preco com ponto não virou virgula');
});

await test('Borda: Campo de texto com tags HTML é sanitizado e não injeta script', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  const xss = '<img src=x onerror=alert(1)>';
  _fGuidedSalvar(xss);
  await espera(100);
  
  // Abre revisão
  fVoltarParaEdicao();
  const lista=document.getElementById('f-respostas');
  // Deve estar escapado na lista
  assert(!lista.querySelector('img.fr-val'),'tag HTML foi injetada como DOM vivo');
  assert(lista.innerHTML.includes('&lt;img') || !lista.innerHTML.includes('<img src=x'),'HTML não foi escapado');
});

await test('Borda: Alternar entre Mobile e Desktop durante a revisão mantém coerência', async()=>{
  setupFixture();
  fSelectCamp('camp-1');
  await fSelectMaterial(dFolders[0].templates[0].id);
  if(document.querySelector('.fg-decision')) fSkipPreStart();
  
  _fGuidedSalvar('data:image/png;base64,x'); await espera(300);
  _fGuidedSalvar('Produto Teste'); await espera(300);
  _fGuidedSalvar('20'); await espera(300);
  _fGuidedSalvar('10');
  
  await esperaCondicao(()=>fState.done===true,'arte concluída');

});

window.__lumaTest={total,passed:total-failures.length,failures};
})().catch(e=>window.__lumaTest={total:1,passed:0,failures:[{name:'bancada',error:e.stack}]});
