<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luma — regressão do EDL de vídeo</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#111;color:#f5f5f5}
    body{max-width:920px;margin:40px auto;padding:0 24px}
    h1{font-size:24px;margin-bottom:8px}.summary{color:#aaa;margin-bottom:24px}
    ol{list-style:none;padding:0;display:grid;gap:8px}.case{padding:12px 14px;border:1px solid #333;border-radius:10px;background:#181818}
    .pass{border-color:#276b42}.fail{border-color:#a33;background:#2a1515}.case strong{display:block}.case small{color:#bbb}
  </style>
</head>
<body>
  <h1>Regressão do EDL de vídeo</h1>
  <div class="summary" id="summary">Executando…</div>
  <ol id="results"></ol>
  <!-- projeto.js não toca no DOM de propósito: a matemática do corte e o validador
       do plano de IA são exercitáveis sem montar a interface do módulo. -->
  <script src="../js/video/projeto.js"></script>
  <script src="../js/video/ingest.js"></script>
  <!-- compositor.js entra pela matemática do enquadramento (vdEnquadrar); não toca DOM na carga. -->
  <script src="../js/video/compositor.js"></script>
  <script src="video-edl-cases.js"></script>
</body>
</html>
