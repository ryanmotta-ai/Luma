</div>

  <button type="button" id="lp-layout-nota" hidden></button>
</aside>
<div id="f-preview-modal"><div id="pv-title"></div><div id="pv-note"></div><div id="pv-multi"></div></div>
<div id="g-toast-container"></div>
<div id="f-head-actions"><button id="f-undo-btn" hidden onclick="fDesfazer()"></button></div>
<p id="f-arte-status" class="f-sr-only" role="status" aria-live="polite"></p>
<div id="f-catalog"></div>

<script>
// Mock de ambiente para bancada autônoma de testes (sem Supabase real nem rede externa)
var dFolders = [], dVars = [];
function gCurrentUser(){ return { id: '11111111-1111-4111-8111-111111111111' }; }
function gIsAdmin(){ return false; }
function gFeatureCan(){ return true; }
function gTrackEvent(){}
function gAiReady(){ return false; }
var sbFake = {
  schema(){
    return {
      from(){
        return {
          upsert(){ return Promise.resolve({ error: null }); },
          select(){ return { eq(){ return { single(){ return Promise.resolve({ data: null }); } }; } }; },
          delete(){ return { eq(){ return Promise.resolve({ error: null }); } }; },
          update(){ return { eq(){ return Promise.resolve({ error: null }); } }; }
        };
      },
      storage: {
        from(){
          return {
            upload(){ return Promise.resolve({ error: null }); },
            getPublicUrl(){ return { data: { publicUrl: 'https://fake.storage/img.png' } }; }
          };
        }
      }
    };
  }
};
function gSupabase(){ return sbFake; }
window.sb = sbFake;

// Extrai variáveis das camadas do template (substitui dependência do designer/templates.js no franqueado)
function dExtractTemplateVars(layers){
  const vars = new Set();
  (layers || []).forEach(l => {
    if(l.content){
      const re = gVarRegex();
      let m;
      while((m = re.exec(l.content))) vars.add(m[1].trim());
    }
    if(l.imgVar) vars.add(l.imgVar.trim());
  });
  return Array.from(vars);
}

// Prefers-reduced-motion ativado para execuções rápidas de timers e transições sem atrasos artificiais de UI
const origMatchMedia = window.matchMedia;
window.matchMedia = function(q){
  if(q && q.includes('prefers-reduced-motion')){
    return {
      matches: true,
      media: q,
      onchange: null,
      addListener(){},
      removeListener(){},
      addEventListener(){},
      removeEventListener(){},
      dispatchEvent(){ return true; }
    };
  }
  if(origMatchMedia) return origMatchMedia.call(window, q);
  return {
    matches: false,
    media: q,
    onchange: null,
    addListener(){},
    removeListener(){},
    addEventListener(){},
    removeEventListener(){},
    dispatchEvent(){ return true; }
  };
};
</script>
