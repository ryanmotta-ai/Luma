<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luma — carga: lote do franqueado e importador de PSD</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#111;color:#f5f5f5}
    body{max-width:920px;margin:40px auto;padding:0 24px}
    h1{font-size:24px;margin-bottom:8px}.summary{color:#aaa;margin-bottom:24px}
    ol{list-style:none;padding:0;display:grid;gap:8px}.case{padding:12px 14px;border:1px solid #333;border-radius:10px;background:#181818}
    .pass{border-color:#276b42}.fail{border-color:#a33;background:#2a1515}.case strong{display:block}.case small{color:#bbb}
  </style>
</head>
<body>
  <h1>Carga — volume realista</h1>
  <div class="summary" id="summary">Gerando 50 artes e processando 300 camadas no motor real…</div>
  <ol id="results"></ol>

  <!-- CADEIA DO FRANQUEADO. `png-generator.js` é o motor que desenha a arte que o franqueado
       baixa; ele depende do interpolador (00-config), do estado (01-state) e do Auto-layout.
       A suíte `franqueado-fluxo.html` já carrega exatamente este conjunto. -->
  <script src="../js/00-config.js"></script>
  <script src="../js/01-state.js"></script>
  <script src="../js/core/toast.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/core/auto-layout.js"></script>
  <script src="../js/franqueado/prefs.js"></script>
  <script src="../js/franqueado/history.js"></script>
  <script src="../js/franqueado/materials.js"></script>
  <script src="../js/franqueado/png-generator.js"></script>

  <!-- CADEIA DO IMPORTADOR. `blending.js` e `fonts.js` entram porque `dItemToLayer` e o
       resolvedor de fonte os consultam; os dois só declaram, nada roda no load. -->
  <script src="../js/designer/blending.js"></script>
  <script src="../js/designer/fonts.js"></script>
  <script src="../js/designer/psd-parse.js"></script>
  <script src="../js/designer/psd-import.js"></script>

  <script src="carga-cases.js"></script>
</body>
</html>
