<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Black Bumerangue · Capa story</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="campanha.css">
<style>
  .capa { background: #f85400; }
  .logo { top: 258px; left: 72px; width: 198px; }
  .topo { position: absolute; top: 270px; right: 72px; color: var(--preto); font-size: 23px; letter-spacing: .2em; }

  .selo { position: absolute; top: 330px; left: 50%; width: 620px; transform: translateX(-50%) rotate(-2deg); }

  .chamada { position: absolute; font-size: 160px; line-height: .98; color: var(--preto); }
  .chamada.l1 { top: 760px; left: 72px; }
  .chamada.l2 { top: 920px; right: 72px; text-align: right; color: #fff; }

  .etiqueta.data { left: 68px; top: 1258px; width: 430px; height: 244px; transform: rotate(-5deg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .data .linha { font-size: 140px; line-height: .86; color: var(--preto); }
  .data .linha em { font-style: normal; color: var(--laranja); }
  .data .rot { margin-top: 10px; font-size: 19px; letter-spacing: .2em; color: var(--cinza); }

  .rodape { position: absolute; left: 74px; top: 1540px; font-size: 23px; letter-spacing: .12em; color: var(--preto); }

  .v1 { left: -80px; top: 300px; width: 220px; transform: rotate(32deg); }
  .v2 { right: -44px; top: 330px; width: 178px; transform: rotate(-27deg); }
  .v3 { left: -66px; top: 1090px; width: 190px; transform: rotate(36deg); }
  .v4 { right: -60px; top: 1120px; width: 196px; transform: rotate(15deg); }
  .v5 { right: -36px; top: 1540px; width: 268px; transform: rotate(-24deg); }
  .v6 { left: -64px; top: 1610px; width: 164px; transform: rotate(40deg); }
</style>
</head>
<body>
<div class="arte story capa campanha">
  <div class="arco a1"></div>
  <div class="arco a2"></div>
  <div class="arco a3"></div>

  <img class="logo" src="../../../assets/logos/dm-h-preta.png" alt="Delivery Much">
  <div class="topo micro">Black Friday · 27.11.2026</div>

  <img class="selo" src="../assets/selo.svg" alt="Black Bumerangue">

  <h1 class="chamada l1 realce realce-sombra">Pedido que vai</h1>
  <h1 class="chamada l2 realce realce-sombra-clara">Cupom que volta</h1>

  <div class="voo v1"><img class="fantasma" src="../assets/bumerangue.svg" alt=""><img class="nitido" src="../assets/bumerangue.svg" alt=""></div>
  <div class="voo v2"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v3"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v4"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v5"><img class="fantasma" src="../assets/bumerangue.svg" alt=""><img class="nitido" src="../assets/bumerangue.svg" alt=""></div>
  <div class="voo v6"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>

  <div class="etiqueta data">
    <div class="linha realce">27 <em>nov</em></div>
    <div class="rot micro">Black Friday</div>
  </div>

  <div class="rodape micro">Sexta-feira · só no app</div>
</div>
</body>
</html>
