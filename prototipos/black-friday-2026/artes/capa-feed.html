<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Black Bumerangue · Capa feed</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="campanha.css">
<style>
  .capa { background: #f85400; }
  .logo { top: 58px; left: 72px; width: 198px; }
  .topo { position: absolute; top: 70px; right: 72px; color: var(--preto); font-size: 23px; letter-spacing: .2em; }

  .selo { position: absolute; top: 66px; left: 50%; width: 556px; transform: translateX(-50%) rotate(-2deg); }

  .chamada { position: absolute; font-size: 150px; line-height: .98; color: var(--preto); }
  .chamada.l1 { top: 434px; left: 70px; }
  .chamada.l2 { top: 578px; right: 70px; text-align: right; color: #fff; }

  .etiqueta.data { left: 62px; top: 902px; width: 438px; height: 252px; transform: rotate(-5deg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .data .linha { font-size: 148px; line-height: .86; color: var(--preto); }
  .data .linha em { font-style: normal; color: var(--laranja); }
  .data .rot { margin-top: 10px; font-size: 20px; letter-spacing: .2em; color: var(--cinza); }

  .rodape { position: absolute; left: 74px; bottom: 54px; font-size: 23px; letter-spacing: .12em; color: var(--preto); }

  /* voos */
  .v1 { left: -74px; top: 118px; width: 208px; transform: rotate(34deg); }
  .v2 { right: -46px; top: 112px; width: 188px; transform: rotate(-27deg); }
  .v3 { right: -70px; top: 724px; width: 218px; transform: rotate(16deg); }
  .v4 { left: -78px; top: 1052px; width: 176px; transform: rotate(38deg); }
  .v5 { right: -54px; bottom: -34px; width: 272px; transform: rotate(-26deg); }
</style>
</head>
<body>
<div class="arte feed capa campanha">
  <div class="arco a1"></div>
  <div class="arco a2"></div>
  <div class="arco a3"></div>

  <img class="logo" src="../../../assets/logos/dm-h-preta.png" alt="Delivery Much">
  <div class="topo micro">Black Friday · 27.11.2026</div>

  <img class="selo" src="../assets/selo.svg" alt="Black Bumerangue">

  <h1 class="chamada l1 realce realce-sombra">Pedido que vai</h1>
  <h1 class="chamada l2 realce realce-sombra-clara">Cupom que volta</h1>

  <div class="voo v1"><img class="fantasma" src="../assets/bumerangue.svg" alt=""><img class="nitido" src="../assets/bumerangue.svg" alt=""></div>
  <div class="voo v2"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v3"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v4"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>
  <div class="voo v5"><img class="fantasma" src="../assets/bumerangue.svg" alt=""><img class="nitido" src="../assets/bumerangue.svg" alt=""></div>

  <div class="etiqueta data">
    <div class="linha realce">27 <em>nov</em></div>
    <div class="rot micro">Black Friday</div>
  </div>

  <div class="rodape micro">Só no app Delivery Much</div>
</div>
</body>
</html>
