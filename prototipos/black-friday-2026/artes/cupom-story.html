<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Black Bumerangue · Cupom story</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="campanha.css">
<style>
  .cupom { background: #f85400; }

  .logo { top: 258px; left: 72px; width: 198px; }
  .topo { position: absolute; top: 270px; right: 72px; color: var(--preto); font-size: 23px; letter-spacing: .2em; }

  .selo { position: absolute; top: 330px; left: 50%; width: 600px; transform: translateX(-50%) rotate(-2deg); }

  .chamada { position: absolute; top: 700px; left: 72px; font-size: 140px; line-height: .95; color: var(--preto); }

  .ticket {
    position: absolute; left: 90px; top: 884px; width: 900px; height: 620px;
    background: #fff; border: 8px solid var(--preto); border-radius: 34px;
    transform: rotate(-5deg);
    box-shadow: 18px 20px 0 rgba(45, 45, 45, .26);
  }
  .ticket .furo { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: var(--preto); top: 384px; }
  .ticket .furo.esq { left: -43px; }
  .ticket .furo.dir { right: -43px; }
  .ticket .picote { position: absolute; left: 42px; right: 42px; top: 420px; border-top: 5px dashed var(--preto); opacity: .85; }

  .ticket .kicker { position: absolute; left: 46px; top: 38px; font-size: 25px; letter-spacing: .17em; color: var(--cinza); }
  .ticket .off { position: absolute; left: 38px; top: 70px; font-size: 230px; line-height: .86; color: var(--laranja); }
  .ticket .no { position: absolute; left: 48px; top: 300px; font-size: 36px; letter-spacing: .04em; color: var(--preto); }

  .ticket .cod-rot { position: absolute; left: 48px; top: 456px; font-size: 22px; letter-spacing: .2em; color: var(--cinza); }
  .ticket .cod { position: absolute; left: 42px; top: 480px; font-size: 118px; line-height: .9; color: var(--preto); }
  .ticket .copie { position: absolute; right: 48px; bottom: 44px; font-size: 21px; letter-spacing: .14em; color: var(--cinza); text-align: right; }

  .icone-cupom { position: absolute; right: 46px; top: 816px; width: 206px; transform: rotate(15deg); }

  .legal { position: absolute; left: 72px; top: 1568px; width: 720px; font-size: 21px; line-height: 1.4; color: var(--preto); }
  .assinatura { position: absolute; right: 72px; bottom: 44px; width: 168px; }

  .v1 { left: -86px; top: 300px; width: 226px; transform: rotate(32deg); }
  .v2 { right: -62px; top: 1010px; width: 184px; transform: rotate(20deg); }
</style>
</head>
<body>
<div class="arte story cupom campanha">
  <div class="arco a1"></div>
  <div class="arco a2"></div>

  <img class="logo" src="../../../assets/logos/dm-h-preta.png" alt="Delivery Much">
  <div class="topo micro">Black Friday · 27.11.2026</div>

  <img class="selo" src="../assets/selo.svg" alt="Black Bumerangue">
  <h1 class="chamada realce realce-sombra">Cupom que volta</h1>

  <div class="ticket">
    <div class="furo esq"></div>
    <div class="furo dir"></div>
    <div class="picote"></div>

    <div class="kicker micro">Cupom Black Bumerangue</div>
    <div class="off realce">20% off</div>
    <div class="no roboto-black">No seu pedido</div>

    <div class="cod-rot micro">Código</div>
    <div class="cod realce">volta20</div>
    <div class="copie micro">Copie e use no app</div>
  </div>

  <img class="icone-cupom" src="../assets/cupom.svg" alt="">

  <div class="voo v1"><img class="fantasma" src="../assets/bumerangue.svg" alt=""><img class="nitido" src="../assets/bumerangue.svg" alt=""></div>
  <div class="voo v2"><img class="fantasma" src="../assets/cupom.svg" alt=""><img class="nitido" src="../assets/cupom.svg" alt=""></div>

  <div class="legal">Válido em 27/11/2026, em pedidos acima de R$ 30,00. Não cumulativo com outras promoções.</div>
  <img class="assinatura" src="../../../assets/logos/dm-h-preta.png" alt="Delivery Much">
</div>
</body>
</html>
