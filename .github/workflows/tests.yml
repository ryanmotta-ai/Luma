name: Regressão (arquitetura · Auto-layout · PSD · corpus · fuzzing)

# Roda as suítes de `tests/` num Chromium headless a cada push e a cada PR.
#
# Por que num navegador de verdade: o Luma não tem build nem runner (1ª lei — ver
# `luma-brain/03_ENGINEERING.md`). Métrica de fonte, Canvas 2D e quebra de linha SÓ existem no
# navegador; testar isso em Node com mock mediria o mock, não o motor.
#
# Zero dependência: `scripts/run-browser-tests.js` fala DevTools Protocol direto, com o
# WebSocket nativo do Node 22. Não há `npm install` neste workflow de propósito.
#
# O que reprova o commit:
#   · qualquer caso vermelho em tests/*.html (invariantes do solver, importador de PSD, corpus);
#   · fuzzing que ache exceção, `NaN`, laço que não converge ou bloqueio sem diagnóstico.
# O golden fino (geometria/imagem) é comparado só quando a pilha de FONTES do runner bate com a
# gravada — senão vira aviso, nunca falso vermelho. Detalhe em `tests/corpus-cases.js`.

on:
  push:
    branches: ['**']
    paths:
      - 'js/**'
      - 'css/**'
      - 'tests/**'
      - 'scripts/run-browser-tests.js'
      - 'scripts/arquitetura.js'
      - 'scripts/novidades.js'
      - 'index.html'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'tests/**'
      - 'scripts/run-browser-tests.js'
      - 'scripts/arquitetura.js'
      - 'scripts/novidades.js'
      - 'index.html'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: luma-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    name: Suítes no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # WebSocket nativo (o cliente CDP depende dele)

      - name: Achar o navegador
        run: |
          # POR QUE NÃO INSTALAR MAIS PELO APT:
          # `chromium-browser` no Ubuntu do runner virou pacote de transição para o SNAP, e snap
          # roda com /tmp PRIVADO. O navegador subia, anunciava a porta no stderr e escrevia o
          # DevToolsActivePort no /tmp dele — que o runner, fora do confinamento, nunca via. O CI
          # ficou vermelho de 14/08 a 19/08 com a mensagem "o Chromium não abriu a porta de
          # depuração", que era mentira: ele abriu. O runner agora lê a porta do stderr (conserto
          # de verdade), e aqui preferimos o navegador que a imagem já traz — mais rápido (some
          # 1min de apt) e sem confinamento.
          BIN=""
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            [ -x "$b" ] && { BIN="$b"; break; }
          done
          if [ -z "$BIN" ]; then
            echo "nenhum navegador na imagem do runner; instalando pelo apt"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends chromium || \
            sudo apt-get install -y --no-install-recommends chromium-browser
            BIN="$(command -v chromium || command -v chromium-browser)"
          fi
          echo "navegador: $BIN"
          "$BIN" --version || true
          echo "CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"
          # Fontes com acento e caixa alta: sem elas a medida de texto muda e o corpus comparado
          # ao golden viraria ruído. Só instala se faltarem — na imagem do runner já vêm.
          if ! fc-list 2>/dev/null | grep -qi liberation; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
          fi

      # Arquitetura ANTES das suítes: é barato (segundos, sem navegador) e falha por motivo
      # diferente. Um `import` solto ou uma função global duplicada não aparecem em teste
      # funcional — o programa continua rodando e a feature morre calada.
      - name: Arquitetura (as leis do luma-brain como portão)
        run: node scripts/arquitetura.js

      # Novidades: no máximo 1 edição a cada 7 dias e nenhum rascunho sem curadoria ("✎ REVISAR")
      # chegando na rede. Segundos, sem navegador. Regras em js/widgets/novidades.js.
      - name: Novidades (cadência e curadoria)
        run: node scripts/novidades.js --checar

      - name: Rodar as suítes
        env:
          LUMA_TEST_REPORT: luma-browser-tests.json
        run: |
          set -o pipefail
          node scripts/run-browser-tests.js 2>&1 | tee luma-browser-tests.log

      - name: Resumir resultados
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('luma-browser-tests.json')) process.exit(0);
          const r = JSON.parse(fs.readFileSync('luma-browser-tests.json', 'utf8'));
          const linhas = ['## Suítes do Luma', '', r.navegador + ' · ' + r.plataforma,
            '', r.casosTotais + ' casos · ' + r.falhasTotais + ' problemas', ''];
          for (const s of r.suites) {
            const falhas = s.resultado && s.resultado.failures || [];
            linhas.push('- ' + s.nome + ': ' + (s.erro ? s.erro :
              s.resultado.passed + '/' + s.resultado.total));
            falhas.forEach(f => linhas.push('  - ' + f.name + ': ' + f.error));
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, linhas.join('\n') + '\n');
          NODE

      # Resultado completo fica disponível mesmo quando uma suíte falha ou trava. Não muda
      # nenhum limite: evita investigar um vermelho sem saber qual caso/ambiente falhou.
      - name: Guardar diagnóstico das suítes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-browser-tests
          path: |
            luma-browser-tests.json
            luma-browser-tests.log
          if-no-files-found: ignore
